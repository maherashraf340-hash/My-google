<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>بحثي - جوجل المنتجات</title>
    <style>
        body { font-family: 'Cairo', Arial; text-align: center; margin-top: 30px; background: #f8f9fa; }
        .logo { font-size: 60px; color: #4285f4; font-weight: bold; }
        input { width: 500px; padding: 12px; font-size: 18px; border-radius: 24px; border: 1px solid #dfe1e5; }
        button { padding: 10px 24px; font-size: 16px; border-radius: 4px; background: #f8f9fa; border: 1px solid #f8f9fa; margin: 10px; }
        .summary { background: #e8f0fe; margin: 20px auto; padding: 15px; width: 70%; border-radius: 8px; text-align: right; }
        .result { background: white; margin: 10px auto; padding: 15px; width: 70%; text-align: right; border-radius: 8px; box-shadow: 0 1px 2px #ccc; }
    </style>
</head>
<body>
    <div class="logo">بحثي</div>
    <form method="POST">
        <input type="text" name="query" placeholder="ابحث عن أي منتج في مصر..." value="{{ query }}">
        <br>
        <button type="submit">بحث</button>
    </form>

    {% if summary %}
    <div class="summary">
        <h3>🤖 الخلاصة بالـ AI:</h3>
        <p>{{ summary }}</p>
    </div>
    {% endif %}

    {% for r in results %}
    <div class="result">
        <h3><a href="{{ r.link }}" target="_blank">{{ r.title }}</a></h3>
        <p><b>السعر: {{ r.price }}</b></p>
    </div>
    {% endfor %}
</body>
</html>
{% if results %}
  {% for item in results %}
    <a href="{{ item.link }}" target="_blank">
      <h3>{{ item.title }}</h3>
      <p>{{ item.price }}</p>
    </a>
  {% endfor %}
{% endif %}
