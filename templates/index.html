<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بحثي - AI Search</title>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f5f5f5; text-align: center; padding: 50px; }
        h1 { color: #4285F4; }
        input { width: 60%; padding: 12px; border: 1px solid #ddd; border-radius: 24px; font-size: 16px; }
        button { padding: 12px 24px; background: #4285F4; color: white; border: none; border-radius: 24px; cursor: pointer; margin-right: 10px; }
        .result { background: white; padding: 20px; margin-top: 20px; border-radius: 10px; text-align: right; }
    </style>
</head>
<body>
    <h1>🔍 بحثي</h1>
    <p>اسأل اي سؤال وهيجاوبك بالذكاء الاصطناعي</p>
    <form method="POST">
        <input type="text" name="query" placeholder="مثلا: افضل موبايل في نون" required>
        <button type="submit">بحث</button>
    </form>

    {% if answer %}
    <div class="result">
        <h3>الاجابة:</h3>
        <p>{{ answer }}</p>
    </div>
    {% endif %}
</body>
</html>
