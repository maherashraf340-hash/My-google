<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بحتي</title>
    <style>
        body { font-family: 'Cairo', sans-serif; text-align: center; background: #f9f9f9; padding: 50px; }
        h1 { color: #0077ff; }
        input { width: 60%; padding: 12px; border-radius: 25px; border: 1px solid #ccc; }
        button { padding: 12px 20px; border-radius: 25px; border: none; background: #0077ff; color: white; cursor: pointer; }
        .result { background: white; margin: 15px auto; padding: 15px; border-radius: 10px; width: 70%; text-align: right; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .result a { text-decoration: none; color: #0077ff; }
    </style>
</head>
<body>

    <h1>بحتي</h1>
    <p>ابحث عن أي منتج في مصر...</p>

    <form method="POST">
        <input type="text" name="query" placeholder="مثال: موبايل سامسونج" value="{{ query }}">
        <button type="submit">بحث</button>
    </form>

    {% if results %}
        <h2>النتائج:</h2>
        {% for r in results %}
            <div class="result">
                <h3><a href="{{ r.link }}" target="_blank">{{ r.title }}</a></h3>
                <p><b>السعر: {{ r.price }}</b></p>
            </div>
        {% endfor %}
    {% endif %}

</body>
</html>
